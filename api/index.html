<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloseMore.ai - AI B2B Sales & Closing Assistant</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px;
}

/* Light & Dark Theme Variables */
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--text-color: #f8fafc;
--text-muted: #94a3b8;
--border-color: #334155;
--input-bg: #0f172a;
--accent-color: #38bdf8;
}
.light {
--bg-color: #f1f5f9;
--card-bg: #ffffff;
--text-color: #0f172a;
--text-muted: #64748b;
--border-color: #cbd5e1;
--input-bg: #f8fafc;
--accent-color: #0284c7;
}

.container {
background-color: var(--card-bg);
width: 100%;
max-width: 680px;
padding: 35px;
border-radius: 20px;
box-shadow: 0 20px 40px rgba(0,0,0,0.4);
border: 1px solid var(--border-color);
position: relative;
}

/* Top Header Actions (Theme Toggle & Status) */
.top-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}
.status-badge {
display: flex;
align-items: center;
gap: 6px;
font-size: 11px;
font-weight: 600;
background: rgba(16, 185, 129, 0.1);
color: #10b981;
padding: 4px 10px;
border-radius: 20px;
border: 1px solid rgba(16, 185, 129, 0.2);
}
.status-dot {
width: 7px;
height: 7px;
background-color: #10b981;
border-radius: 50%;
box-shadow: 0 0 8px #10b981;
animation: pulse 2s infinite;
}
@keyframes pulse {
0% { transform: scale(0.95); opacity: 0.8; }
50% { transform: scale(1.15); opacity: 1; }
100% { transform: scale(0.95); opacity: 0.8; }
}
.btn-theme {
background: var(--input-bg);
border: 1px solid var(--border-color);
color: var(--text-color);
padding: 6px 12px;
border-radius: 8px;
font-size: 13px;
cursor: pointer;
}
.btn-theme:hover {
border-color: var(--accent-color);
}

h1 {
font-size: 28px;
color: var(--accent-color);
margin-bottom: 4px;
text-align: center;
font-weight: 800;
letter-spacing: -0.5px;
}
p.subtitle {
text-align: center;
color: var(--text-muted);
font-size: 14px;
margin-bottom: 28px;
}

.form-group {
margin-bottom: 20px;
}
label {
display: block;
font-size: 13px;
font-weight: 600;
margin-bottom: 6px;
color: var(--text-color);
}
textarea, select {
width: 100%;
padding: 12px 14px;
background-color: var(--input-bg);
border: 1px solid var(--border-color);
border-radius: 10px;
color: var(--text-color);
font-size: 14px;
resize: vertical;
}
textarea:focus, select:focus {
outline: none;
border-color: var(--accent-color);
box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
}
.row {
display: flex;
gap: 15px;
}
.row .form-group {
flex: 1;
}

button.btn-submit {
width: 100%;
padding: 15px;
background: linear-gradient(135deg, #2563eb, #0284c7);
color: white;
border: none;
border-radius: 10px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: all 0.25s ease;
margin-top: 10px;
box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
}
button.btn-submit:hover {
opacity: 0.95;
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
}

.result-box {
margin-top: 25px;
padding: 20px;
background-color: var(--input-bg);
border-radius: 12px;
border: 1px solid var(--border-color);
display: none;
animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(6px); }
to { opacity: 1; transform: translateY(0); }
}
.result-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px;
}
.result-title {
font-size: 12px;
font-weight: bold;
color: var(--accent-color);
text-transform: uppercase;
letter-spacing: 0.8px;
}
.btn-copy {
background-color: var(--border-color);
color: var(--text-color);
border: none;
padding: 6px 14px;
border-radius: 6px;
font-size: 12px;
font-weight: 600;
cursor: pointer;
transition: 0.2s;
}
.btn-copy:hover {
opacity: 0.8;
}
.result-content {
font-size: 14px;
line-height: 1.7;
color: var(--text-color);
white-space: pre-wrap;
}
</style>
</head>
<body>

<div class="container">
<div class="top-header">
<div class="status-badge">
<div class="status-dot"></div>
API Connected & Ready
</div>
<button class="btn-theme" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
</div>

<h1>CloseMore.ai</h1>
<p class="subtitle">AI-Powered B2B Sales & Closing Assistant</p>

<div class="form-group">
<label for="companyInfo">Company / Product Memory & Offer Details:</label>
<textarea id="companyInfo" rows="3" placeholder="e.g. We sell enterprise CRM software for $200/mo. Key value: 24/7 dedicated support, free onboarding, and guaranteed 30% ROI within 60 days."></textarea>
</div>

<div class="form-group">
<label for="customerMessage">Customer Objection / Message:</label>
<textarea id="customerMessage" rows="3" placeholder="e.g. Your price is higher than Competitor X. Why should we choose you?"></textarea>
</div>

<div class="row">
<div class="form-group">
<label for="tone">Response Strategy / Tone:</label>
<select id="tone">
<option value="Persuasive & Value-Driven">Persuasive & Value-Driven</option>
<option value="Executive & Professional">Executive & Professional</option>
<option value="Urgency & Deal Closing">Urgency & Deal Closing</option>
<option value="Consultative & Problem Solving">Consultative & Problem Solving</option>
</select>
</div>

<div class="form-group">
<label for="language">Output Language:</label>
<select id="language">
<option value="English">English 🇺🇸</option>
<option value="Turkish">Turkish 🇹🇷</option>
<option value="German">German 🇩🇪</option>
<option value="Spanish">Spanish 🇪🇸</option>
</select>
</div>
</div>

<button class="btn-submit" onclick="generateReply()">Generate Sales Reply ✨</button>

<div class="result-box" id="resultBox">
<div class="result-header">
<span class="result-title">Suggested Sales Response</span>
<button class="btn-copy" onclick="copyReply()" id="copyBtn">Copy 📋</button>
</div>
<div class="result-content" id="replyText"></div>
</div>
</div>

<script>
function toggleTheme() {
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
if (html.classList.contains('dark')) {
html.classList.remove('dark');
html.classList.add('light');
themeBtn.innerText = '☀️ Light Mode';
} else {
html.classList.remove('light');
html.classList.add('dark');
themeBtn.innerText = '🌙 Dark Mode';
}
}

async function generateReply() {
const companyInfo = document.getElementById('companyInfo').value;
const customerMessage = document.getElementById('customerMessage').value;
const tone = document.getElementById('tone').value;
const language = document.getElementById('language').value;
const resultBox = document.getElementById('resultBox');
const replyText = document.getElementById('replyText');

if (!customerMessage) {
alert('Please enter a customer message or objection.');
return;
}

replyText.innerText = 'AI is crafting your high-converting reply...';
resultBox.style.display = 'block';

try {
const response = await fetch('/api/generate-reply', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ companyInfo, customerMessage, tone, language })
});

const data = await response.json();

if (data.success) {
replyText.innerText = data.reply;
} else {
replyText.innerText = 'Error: ' + (data.error || 'Failed to generate response.');
}
} catch (err) {
replyText.innerText = 'Could not connect to server. Make sure server.js is running.';
}
}

function copyReply() {
const text = document.getElementById('replyText').innerText;
navigator.clipboard.writeText(text).then(() => {
const copyBtn = document.getElementById('copyBtn');
copyBtn.innerText = 'Copied! ✅';
setTimeout(() => { copyBtn.innerText = 'Copy 📋'; }, 2000);
});
}
</script>
</body>
</html>
